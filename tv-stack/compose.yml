services:

  threadfin:
    image: fyb3roptik/threadfin:latest

    container_name: threadfin

    restart: unless-stopped

    ports:
      - "34400:34400"

    volumes:
      - ./threadfin/config:/home/threadfin/conf

    networks:
      - media

networks:
  media:
    external: true
    name: media_media